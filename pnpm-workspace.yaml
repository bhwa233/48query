packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  workerd: true
  sharp: true
  unrs-resolver: true

# Security fixes for upstream packages with stale transitive ranges.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  postcss: 8.5.30
  'fflate@<0.7.5': 0.7.5

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
