name: Pocket48 room diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COLLECTOR_CREDENTIAL_READ_TOKEN: ${{ secrets.COLLECTOR_CREDENTIAL_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Inspect room response shapes only
        run: |
          node --input-type=module <<'JS'
          import { createPocket48Pa } from './apps/collector/src/pocket48-auth.mjs';
          const response = await fetch('https://api.bhwa233.com/api/collector/credentials', {
            headers: { Authorization: `Bearer ${process.env.COLLECTOR_CREDENTIAL_READ_TOKEN}` },
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`Credential endpoint HTTP ${response.status}`);
          const { data } = await response.json();
          const shape = (value, depth = 0) => {
            if (value === null) return 'null';
            if (depth > 3) return typeof value;
            if (Array.isArray(value)) return { type: 'array', length: value.length, first: shape(value[0], depth + 1) };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).filter(key => /^[A-Za-z][A-Za-z0-9_]{0,31}$/.test(key)).slice(0, 30).map(key => [key, shape(value[key], depth + 1)]));
            return typeof value;
          };
          for (const [version, build] of [['7.1.35', '25101021']]) {
            const result = await fetch('https://pocketapi.48.cn/im/api/v1/im/server/jump', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json;charset=utf-8',
                'User-Agent': `PocketFans201807/${version} (iPhone; iOS 16.3.1; Scale/2.00)`,
                appInfo: JSON.stringify({ vendor: 'apple', deviceId: data.deviceId, appVersion: version, appBuild: build, osVersion: '16.3.1', osType: 'ios', deviceName: 'iPhone XR', os: 'ios' }),
                token: data.token,
                pa: await createPocket48Pa(),
              },
              body: JSON.stringify({ starId: 1, targetType: 1, tabId: 0 }),
              signal: AbortSignal.timeout(20000),
            });
            const body = await result.json();
            console.log('[DEBUG-pocket48-room]', JSON.stringify({ version, http: result.status, status: typeof body.status === 'number' ? body.status : 'unknown', success: body.success === true, targetIsStar: body.content?.star === true, shape: shape(body) }));
          }
          JS
