name: Daily collector

on:
  schedule:
    # Every two hours, at :17 to avoid the busiest start-of-hour queue.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages per member"
        required: false
        default: ""
      history_pages:
        description: "History pages per source; 0 skips backfill, empty follows max_pages"
        required: false
        default: ""
      max_members:
        description: "Maximum members; 0 means all members in the selected scope"
        required: false
        default: "0"
      member_id:
        description: "Optional specific Pocket48 member ID"
        required: false
        default: ""
      member_scope:
        description: "Member scope; all may contain rooms not followed by this account"
        type: choice
        options:
          - followed
          - all
        default: followed
      dry_run:
        description: "Inspect sources without database writes or media uploads"
        type: boolean
        default: false
      diagnostics:
        description: "Log response field names/types only (no content or credentials)"
        type: boolean
        default: false
      defer_media:
        description: "Defer media uploads so a targeted run spends its budget on content"
        type: boolean
        default: false
      sources:
        description: "Comma-separated content sources; empty uses all seven"
        required: false
        default: ""
      group_minutes:
        description: "Collection budget in minutes (1-60); checkpoints survive a bounded stop"
        required: false
        default: "60"
      group_refresh:
        description: "Rotate previously collected group members for incremental updates"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: 48query-production-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Pocket48 data
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      POCKET48_LOG_SCHEMA: ${{ inputs.diagnostics && '1' || '0' }}
      COLLECTOR_SOURCE: pocket48
      # Inclusive boundary: 2026-01-01 00:00 Asia/Shanghai. Never crawl earlier.
      COLLECTOR_SINCE: "2026-01-01T00:00:00+08:00"
      COLLECTOR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      COLLECTOR_FAIL_ON_ERROR: "1"
      COLLECTOR_MAX_PAGES: ${{ inputs.max_pages || ((inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed') == 'all' && (vars.COLLECTOR_GROUP_MAX_PAGES || '1')) || vars.COLLECTOR_MAX_PAGES || '10' }}
      COLLECTOR_HISTORY_PAGES: ${{ inputs.history_pages || ((inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed') == 'all' && (vars.COLLECTOR_GROUP_HISTORY_PAGES || '1')) || vars.COLLECTOR_HISTORY_PAGES || '' }}
      COLLECTOR_MAX_MEMBERS: ${{ inputs.max_members || vars.COLLECTOR_MAX_MEMBERS || '0' }}
      COLLECTOR_MEMBER_ID: ${{ inputs.member_id }}
      COLLECTOR_MEMBER_SCOPE: ${{ inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed' }}
      COLLECTOR_SOURCES: ${{ inputs.sources || vars.COLLECTOR_SOURCES || 'room,album,essence,posts,post_images,weibo,room_posts' }}
      GALLERY_BASE_URL: ${{ vars.GALLERY_BASE_URL || 'https://gallery233.pages.dev' }}
      COLLECTOR_CATALOG_RETRY_LIMIT: ${{ vars.COLLECTOR_CATALOG_RETRY_LIMIT || '10' }}
      POCKET48_ALBUM_ORIGINAL_PAGES: ${{ vars.POCKET48_ALBUM_ORIGINAL_PAGES || '3' }}
      COLLECTOR_IMAGE_RETRY_LIMIT: ${{ vars.COLLECTOR_IMAGE_RETRY_LIMIT || '25' }}
      COLLECTOR_VIDEO_MAX_MIB: ${{ vars.COLLECTOR_VIDEO_MAX_MIB || '50' }}
      POCKET48_MIN_INTERVAL_MS: ${{ vars.POCKET48_MIN_INTERVAL_MS || '5000' }}
      COLLECTOR_CREDENTIALS_URL: ${{ vars.COLLECTOR_CREDENTIALS_URL || 'https://api.bhwa233.com/api/collector/credentials' }}
      COLLECTOR_CREDENTIAL_READ_TOKEN: ${{ secrets.COLLECTOR_CREDENTIAL_READ_TOKEN }}
      INGEST_API_URL: ${{ vars.INGEST_API_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
      COLLECTOR_GROUP_ARTIFACT: ${{ inputs.dry_run && 'group-state-2026-dry-run' || 'group-state-2026-live' }}
      COLLECTOR_GROUP_LIMIT: ${{ (inputs.max_members != '0' && inputs.max_members) || vars.COLLECTOR_GROUP_LIMIT || '1000' }}
      COLLECTOR_GROUP_MINUTES: ${{ inputs.group_minutes || '60' }}
      COLLECTOR_MAX_SECONDS: "3600"
      COLLECTOR_DEFER_MEDIA: ${{ (inputs.defer_media || ((inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed') == 'all' && !inputs.member_id)) && '1' || '0' }}
      COLLECTOR_GROUP_REFRESH: ${{ (github.event_name == 'schedule' || inputs.group_refresh) && '1' || '0' }}
      COLLECTOR_GROUP_WEEKLY_RECHECK: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${COLLECTOR_CREDENTIALS_URL}" ]] || missing+=(COLLECTOR_CREDENTIALS_URL)
          [[ -n "${COLLECTOR_CREDENTIAL_READ_TOKEN}" ]] || missing+=(COLLECTOR_CREDENTIAL_READ_TOKEN)
          [[ -n "${INGEST_API_URL}" ]] || missing+=(INGEST_API_URL)
          [[ -n "${INGEST_KEY}" ]] || missing+=(INGEST_KEY)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing collector configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/install-build-dependencies.mjs
      - name: Set collector progress paths
        shell: bash
        run: |
          echo "COLLECTOR_GROUP_STATE=$RUNNER_TEMP/48query-group/progress.json" >> "$GITHUB_ENV"
          echo "COLLECTOR_CHECKPOINT_STATE=$RUNNER_TEMP/48query-group/scoped-sync.json" >> "$GITHUB_ENV"
          echo "COLLECTOR_REPORT_PATH=$RUNNER_TEMP/48query-group/health.json" >> "$GITHUB_ENV"
      - name: Restore collector progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-group-state.mjs
      - name: Run collector
        timeout-minutes: 65
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COLLECTOR_GROUP_MINUTES" =~ ^[1-9][0-9]?$ ]] && (( COLLECTOR_GROUP_MINUTES <= 60 )) || { echo "Invalid group time budget"; exit 1; }
          if [[ "$COLLECTOR_MEMBER_SCOPE" == "all" && -z "$COLLECTOR_MEMBER_ID" ]]; then
            export COLLECTOR_GROUP_MAX_SECONDS="$((COLLECTOR_GROUP_MINUTES * 60))"
            flags=(--collect --update-roster)
            [[ "$COLLECTOR_DRY_RUN" == "1" ]] && flags+=(--dry-run)
            [[ "$COLLECTOR_GROUP_REFRESH" == "1" ]] && flags+=(--refresh)
            pnpm --filter @starter/collector group "${flags[@]}"
          else
            export COLLECTOR_MAX_SECONDS="$((COLLECTOR_GROUP_MINUTES * 60))"
            pnpm --filter @starter/collector run run
          fi
      - name: Save collector progress
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.COLLECTOR_GROUP_ARTIFACT }}
          path: |
            ${{ env.COLLECTOR_GROUP_STATE }}
            ${{ env.COLLECTOR_CHECKPOINT_STATE }}
            ${{ env.COLLECTOR_REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 30
  media:
    name: Retry verified media
    if: inputs.dry_run != true && (inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed') == 'all' && !inputs.member_id
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      COLLECTOR_SOURCE: pocket48
      COLLECTOR_SINCE: "2026-01-01T00:00:00+08:00"
      COLLECTOR_MAX_SECONDS: "900"
      COLLECTOR_IMAGE_RETRY_LIMIT: "100"
      COLLECTOR_MEDIA_RETRY_BATCHES: "100"
      COLLECTOR_VIDEO_MAX_MIB: ${{ vars.COLLECTOR_VIDEO_MAX_MIB || '50' }}
      GALLERY_BASE_URL: ${{ vars.GALLERY_BASE_URL || 'https://gallery233.pages.dev' }}
      INGEST_API_URL: ${{ vars.INGEST_API_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/install-build-dependencies.mjs
      - name: Retry media within its own budget
        timeout-minutes: 20
        run: |
          export COLLECTOR_REPORT_PATH="$RUNNER_TEMP/media-health.json"
          pnpm --filter @starter/collector run run --retry-media
      - name: Save media health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-health-2026
          path: ${{ runner.temp }}/media-health.json
          if-no-files-found: warn
          retention-days: 30
