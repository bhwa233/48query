name: Daily collector

on:
  schedule:
    # 01:00 Asia/Shanghai. GitHub schedules use UTC.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages per member"
        required: false
        default: "10"
      max_members:
        description: "Maximum members; 0 means all members"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: 48query-production-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Pocket48 data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      COLLECTOR_SOURCE: pocket48
      COLLECTOR_DRY_RUN: "0"
      COLLECTOR_FAIL_ON_ERROR: "1"
      COLLECTOR_MAX_PAGES: ${{ inputs.max_pages || vars.COLLECTOR_MAX_PAGES || '10' }}
      COLLECTOR_MAX_MEMBERS: ${{ inputs.max_members || vars.COLLECTOR_MAX_MEMBERS || '0' }}
      POCKET48_MIN_INTERVAL_MS: ${{ vars.POCKET48_MIN_INTERVAL_MS || '5000' }}
      POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
      POCKET48_DEVICE_ID: ${{ secrets.POCKET48_DEVICE_ID }}
      INGEST_API_URL: ${{ vars.INGEST_API_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${POCKET48_TOKEN}" ]] || missing+=(POCKET48_TOKEN)
          [[ -n "${POCKET48_DEVICE_ID}" ]] || missing+=(POCKET48_DEVICE_ID)
          [[ -n "${INGEST_API_URL}" ]] || missing+=(INGEST_API_URL)
          [[ -n "${INGEST_KEY}" ]] || missing+=(INGEST_KEY)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing collector configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run collector
        run: pnpm --filter @starter/collector run
