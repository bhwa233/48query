name: Daily collector

on:
  schedule:
    # 01:00 Asia/Shanghai. GitHub schedules use UTC.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages per member"
        required: false
        default: "10"
      history_pages:
        description: "History pages per source; 0 skips backfill, empty follows max_pages"
        required: false
        default: ""
      max_members:
        description: "Maximum members; 0 means all members in the selected scope"
        required: false
        default: "0"
      member_id:
        description: "Optional specific Pocket48 member ID"
        required: false
        default: ""
      member_scope:
        description: "Member scope; all may contain rooms not followed by this account"
        type: choice
        options:
          - followed
          - all
        default: followed
      dry_run:
        description: "Inspect sources without database writes or media uploads"
        type: boolean
        default: false
      diagnostics:
        description: "Log response field names/types only (no content or credentials)"
        type: boolean
        default: false
      sources:
        description: "Comma-separated content sources; empty uses all seven"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: 48query-production-collector${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Pocket48 data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      POCKET48_LOG_SCHEMA: ${{ inputs.diagnostics && '1' || '0' }}
      COLLECTOR_SOURCE: pocket48
      COLLECTOR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      COLLECTOR_FAIL_ON_ERROR: "1"
      COLLECTOR_MAX_PAGES: ${{ inputs.max_pages || vars.COLLECTOR_MAX_PAGES || '10' }}
      COLLECTOR_HISTORY_PAGES: ${{ inputs.history_pages || vars.COLLECTOR_HISTORY_PAGES || '' }}
      COLLECTOR_MAX_MEMBERS: ${{ inputs.max_members || vars.COLLECTOR_MAX_MEMBERS || '0' }}
      COLLECTOR_MEMBER_ID: ${{ inputs.member_id }}
      COLLECTOR_MEMBER_SCOPE: ${{ inputs.member_scope || vars.COLLECTOR_MEMBER_SCOPE || 'followed' }}
      COLLECTOR_SOURCES: ${{ inputs.sources || vars.COLLECTOR_SOURCES || 'room,album,essence,posts,post_images,weibo,room_posts' }}
      GALLERY_BASE_URL: ${{ vars.GALLERY_BASE_URL || 'https://gallery233.pages.dev' }}
      COLLECTOR_CATALOG_RETRY_LIMIT: ${{ vars.COLLECTOR_CATALOG_RETRY_LIMIT || '10' }}
      POCKET48_ALBUM_ORIGINAL_PAGES: ${{ vars.POCKET48_ALBUM_ORIGINAL_PAGES || '3' }}
      COLLECTOR_IMAGE_RETRY_LIMIT: ${{ vars.COLLECTOR_IMAGE_RETRY_LIMIT || '25' }}
      COLLECTOR_VIDEO_MAX_MIB: ${{ vars.COLLECTOR_VIDEO_MAX_MIB || '50' }}
      POCKET48_MIN_INTERVAL_MS: ${{ vars.POCKET48_MIN_INTERVAL_MS || '5000' }}
      COLLECTOR_CREDENTIALS_URL: ${{ vars.COLLECTOR_CREDENTIALS_URL || 'https://api.bhwa233.com/api/collector/credentials' }}
      COLLECTOR_CREDENTIAL_READ_TOKEN: ${{ secrets.COLLECTOR_CREDENTIAL_READ_TOKEN }}
      INGEST_API_URL: ${{ vars.INGEST_API_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${COLLECTOR_CREDENTIALS_URL}" ]] || missing+=(COLLECTOR_CREDENTIALS_URL)
          [[ -n "${COLLECTOR_CREDENTIAL_READ_TOKEN}" ]] || missing+=(COLLECTOR_CREDENTIAL_READ_TOKEN)
          [[ -n "${INGEST_API_URL}" ]] || missing+=(INGEST_API_URL)
          [[ -n "${INGEST_KEY}" ]] || missing+=(INGEST_KEY)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing collector configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run collector
        run: pnpm --filter @starter/collector run run
