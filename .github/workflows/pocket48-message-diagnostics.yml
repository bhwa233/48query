name: Pocket48 message shape diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COLLECTOR_CREDENTIAL_READ_TOKEN: ${{ secrets.COLLECTOR_CREDENTIAL_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Inspect message response shape only
        run: |
          node --input-type=module <<'JS'
          import { createPocket48Pa } from './apps/collector/src/pocket48-auth.mjs';
          const response = await fetch('https://api.bhwa233.com/api/collector/credentials', {
            headers: { Authorization: `Bearer ${process.env.COLLECTOR_CREDENTIAL_READ_TOKEN}` },
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`Credential endpoint HTTP ${response.status}`);
          const { data } = await response.json();
          const shape = (value, depth = 0) => {
            if (value === null) return 'null';
            if (depth > 3) return typeof value;
            if (Array.isArray(value)) return { type: 'array', length: value.length, first: shape(value[0], depth + 1) };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).filter(key => /^[A-Za-z][A-Za-z0-9_]{0,31}$/.test(key)).slice(0, 30).map(key => [key, shape(value[key], depth + 1)]));
            return typeof value;
          };
          const post = async (pathname, requestBody, legacyProfile = false) => {
            const result = await fetch(`https://pocketapi.48.cn${pathname}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json;charset=utf-8',
                'User-Agent': legacyProfile ? 'PocketFans201807/7.0.4 (iPhone; iOS 15.4.1; Scale/2.00)' : 'PocketFans201807/7.1.35 (iPhone; iOS 16.3.1; Scale/2.00)',
                appInfo: JSON.stringify({ vendor: 'apple', deviceId: data.deviceId, appVersion: legacyProfile ? '7.0.4' : '7.1.35', appBuild: legacyProfile ? '23011601' : '25101021', osVersion: '16.3.1', osType: 'ios', deviceName: 'iPhone XR', os: 'ios' }),
                token: data.token,
                pa: await createPocket48Pa(),
              },
              body: JSON.stringify(requestBody),
              signal: AbortSignal.timeout(20000),
            });
            const body = await result.json();
            console.log('[message-shape]', JSON.stringify({ pathname, http: result.status, status: typeof body.status === 'number' ? body.status : 'unknown', success: body.success === true, targetIsStar: body.content?.star === true, targetFollowed: body.content?.friend === true, legacyProfile, requestLimit: requestBody.limit, requestStartsAtZero: requestBody.nextTime === 0, shape: shape(body) }));
            return body;
          };
          const pause = () => new Promise(resolve => setTimeout(resolve, 5000));
          const room = await post('/im/api/v1/im/server/jump', { starId: 63566, targetType: 1, tabId: 0 });
          await pause();
          const info = await post('/im/api/v1/im/team/room/info', { channelId: String(room.content?.channelId) });
          const directoryResponse = await fetch('https://fastly.jsdelivr.net/gh/duan602728596/qqtools@main/packages/NIMTest/node/roomId.json');
          const directory = (await directoryResponse.json()).roomId;
          const original = directory.find(member => String(member.id) === '63566');
          console.log('[message-shape]', JSON.stringify({ roomOwnerMatches: String(info.content?.channelInfo?.ownerId) === '63566', directoryChannelMatches: String(original?.channelId) === String(room.content?.channelId), channelPocketType: info.content?.channelInfo?.channelPocketType, functionType: info.content?.channelInfo?.functionType }));
          await pause();
          const all = await post('/im/api/v1/team/message/list/all', { channelId: Number(room.content?.channelId), serverId: Number(room.content?.serverId), nextTime: 0, limit: 50 });
          const messages = all.content?.message ?? [];
          const types = {};
          let ownerMessages = 0;
          for (const message of messages) {
            types[message.msgType] = (types[message.msgType] ?? 0) + 1;
            try { const ext = JSON.parse(message.extInfo); if (String(ext.user?.userId ?? ext.user?.id) === '63566') ownerMessages++; } catch {}
          }
          console.log('[message-shape]', JSON.stringify({ types, ownerMessages }));
          if (original && String(original.channelId) !== String(room.content?.channelId)) {
            await pause();
            await post('/im/api/v1/team/message/list/homeowner', { channelId: Number(original.channelId), serverId: Number(original.serverId), nextTime: 0, limit: 25 });
          }
          await pause();
          const follows = await post('/user/api/v1/friendships/friends/id', {});
          const ids = new Set((follows.content?.data ?? []).map(String));
          const candidates = directory.filter(member => ids.has(String(member.id)) && !['63', '63566'].includes(String(member.id))).slice(0, 2);
          for (const member of candidates) {
            await pause();
            const current = await post('/im/api/v1/im/server/jump', { starId: Number(member.id), targetType: 1, tabId: 0 });
            await pause();
            await post('/im/api/v1/team/message/list/homeowner', { channelId: Number(current.content?.channelId), serverId: Number(current.content?.serverId), nextTime: 0, limit: 25 });
          }
          JS
