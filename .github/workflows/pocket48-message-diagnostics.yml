name: Pocket48 message shape diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COLLECTOR_CREDENTIAL_READ_TOKEN: ${{ secrets.COLLECTOR_CREDENTIAL_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Inspect message response shape only
        run: |
          node --input-type=module <<'JS'
          import { createPocket48Pa } from './apps/collector/src/pocket48-auth.mjs';
          const response = await fetch('https://api.bhwa233.com/api/collector/credentials', {
            headers: { Authorization: `Bearer ${process.env.COLLECTOR_CREDENTIAL_READ_TOKEN}` },
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`Credential endpoint HTTP ${response.status}`);
          const { data } = await response.json();
          const shape = (value, depth = 0) => {
            if (value === null) return 'null';
            if (depth > 3) return typeof value;
            if (Array.isArray(value)) return { type: 'array', length: value.length, first: shape(value[0], depth + 1) };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).filter(key => /^[A-Za-z][A-Za-z0-9_]{0,31}$/.test(key)).slice(0, 30).map(key => [key, shape(value[key], depth + 1)]));
            return typeof value;
          };
          const post = async (pathname, requestBody) => {
            const result = await fetch(`https://pocketapi.48.cn${pathname}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json;charset=utf-8',
                'User-Agent': 'PocketFans201807/7.1.35 (iPhone; iOS 16.3.1; Scale/2.00)',
                appInfo: JSON.stringify({ vendor: 'apple', deviceId: data.deviceId, appVersion: '7.1.35', appBuild: '25101021', osVersion: '16.3.1', osType: 'ios', deviceName: 'iPhone XR', os: 'ios' }),
                token: data.token,
                pa: await createPocket48Pa(),
              },
              body: JSON.stringify(requestBody),
              signal: AbortSignal.timeout(20000),
            });
            const body = await result.json();
            console.log('[message-shape]', JSON.stringify({ pathname, http: result.status, status: typeof body.status === 'number' ? body.status : 'unknown', success: body.success === true, targetIsStar: body.content?.star === true, targetFollowed: body.content?.friend === true, requestLimit: requestBody.limit, requestStartsAtZero: requestBody.nextTime === 0, shape: shape(body) }));
            return body;
          };
          const room = await post('/im/api/v1/im/server/jump', { starId: 63566, targetType: 1, tabId: 0 });
          await new Promise(resolve => setTimeout(resolve, 5000));
          await post('/im/api/v1/team/message/list/homeowner', {
            channelId: Number(room.content?.channelId),
            serverId: Number(room.content?.jumpServerInfo?.serverId ?? room.content?.serverId),
            nextTime: 0, limit: 25,
          });
          for (const pagination of [{ nextTime: 0, limit: 50 }, { nextTime: Date.now(), limit: 25 }]) {
            await new Promise(resolve => setTimeout(resolve, 5000));
            await post('/im/api/v1/team/message/list/homeowner', {
              channelId: Number(room.content?.channelId),
              serverId: Number(room.content?.jumpServerInfo?.serverId ?? room.content?.serverId),
              ...pagination,
            });
          }
          JS
